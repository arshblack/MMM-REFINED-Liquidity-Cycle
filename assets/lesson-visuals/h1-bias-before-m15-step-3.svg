">not drawn.</tspan><tspan x="291.25" dy="13.5">Bias is not</tspan><tspan x="291.25" dy="13.5">a forecast.</tspan></text></g><g class="st" data-s="3"><rect x="192.5" y="103.8" width="41.0" height="53.3" rx="2" class="lvl s-gold" /><text x="213.0" y="171.1" class="t gold halo" text-anchor="middle">zoomed ↓</text></g><g class="st" data-s="2"><rect x="10" y="262" width="340" height="46" rx="6" class="chip-gold" /><text x="20" y="280" class="t k gold">WRITTEN BIAS</text><text x="20" y="298" class="t b">“Upside is supported while H1 holds above HL1.”</text></g><g class="st" data-s="3"><rect x="10" y="322" width="340" height="176" rx="6" class="panel" /><text x="20" y="340" class="t k gold">M15 · INSIDE THE GOLD BOX</text><line x1="24" y1="358.6" x2="24" y2="371.9" class="wk" /><rect x="20.0" y="363.1" width="8" height="6.599999999999966" class="cd" stroke-width="1" /><line x1="39" y1="365.3" x2="39" y2="380.8" class="wk" /><rect x="35.0" y="369.7" width="8" height="8.900000000000034" class="cd" stroke-width="1" /><line x1="54" y1="369.7" x2="54" y2="383.0" class="wk" /><rect x="50.0" y="371.9" width="8" height="6.7000000000000455" class="cu" stroke-width="1" /><line x1="69" y1="369.7" x2="69" y2="391.9" class="wk" /><rect x="65.0" y="371.9" width="8" height="17.700000000000045" class="cd" stroke-width="1" /><line x1="84" y1="385.2" x2="84" y2="400.7" class="wk" /><rect x="80.0" y="389.6" width="8" height="8.899999999999977" class="cd" stroke-width="1" /><line x1="99" y1="387.4" x2="99" y2="402.9" class="wk" /><rect x="95.0" y="391.9" width="8" height="6.600000000000023" class="cu" stroke-width="1" /><line x1="114" y1="389.6" x2="114" y2="414.0" class="wk" /><rect x="110.0" y="391.9" width="8" height="19.900000000000034" class="cd" stroke-width="1" /><line x1="129" y1="407.4" x2="129" y2="425.1" class="wk" /><rect x="125.0" y="411.8" width="8" height="11.099999999999966" class="cd" stroke-width="1" /><line x1="144" y1="409.6" x2="144" y2="427.3" class="wk" /><rect x="140.