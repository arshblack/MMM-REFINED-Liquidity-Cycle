<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="h1-bias-before-m15-t h1-bias-before-m15-d" class="rlv-svg" data-steps="4"><title id="h1-bias-before-m15-t">H1 Bias Before M15 — synthetic schematic</title><desc id="h1-bias-before-m15-d">Top panel, H1: swing low L, higher high HH, higher low HL1, higher high HH1. A dashed rust line at HL1 marks the invalidation: an H1 close below HL1. The area after the last candle is left blank and labelled 'not drawn — bias is not a forecast'. Written bias: upside is supported while H1 holds above HL1. Bottom panel, M15 zoom of the last H1 candles: a run of lower highs that alone reads bearish but inside H1 is a pullback toward HL1. One M15 wick dips below HL1 and closes above it — not an invalidation. Two outcomes are shown equally: H1 closes hold above HL1, bias still valid; an H1 candle closes below HL1, bias invalid and no bias yet.</desc><style>
