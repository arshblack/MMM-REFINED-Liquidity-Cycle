<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="pre-trade-journal-t pre-trade-journal-d" class="rlv-svg" data-steps="4"><title id="pre-trade-journal-t">The Journal Entry You Write Before the Trade — plan-to-review board</title><desc id="pre-trade-journal-d">An illustrative entry at 09:38 London. Plan: thesis — H1 lower highs, M15 reached above EQH1 and closed back below; invalidation — an M15 close back above EQH1, a defined event; risk — 0.5 percent, illustrative only, lot size from your MT5 specification; what would stop me — no follow-through in two candles; two further fields in the lesson. Decide: a gate asks whether invalidation is a number or event. No leads to skipped or expired — not ready, or the stop-me condition hit first, no order, still logged. Yes leads to order placed, entry timestamped after the plan, outcome recorded. Review: score execution, not profit — did I wait for what the thesis said, did I honour the invalidation, was risk what I wrote. Skipped entries count too, they keep the sample honest.</desc><style>
.bg{fill:var(--rl-ground,#08090D)}
.panel{fill:var(--rl-panel,#12151E);stroke:var(--rl-line,#303744);stroke-width:1}
.grid{stroke:var(--rl-line,#303744);stroke-width:1}
.t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;fill:var(--rl-text,#F3F2EC)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.h{font-size:12.5px;font-weight:650}
.k{font-size:10.5px;letter-spacing:.045em;text-transform:uppercase;font-weight:600}
.mut{fill:var(--rl-muted,#AEB4BF)}
.it{font-style:italic}
.b{font-weight:650}
.gold{fill:var(--rl-gold,#E9C97A)} .aqua{fill:var(--rl-aqua,#3FE0C5)} .rust{fill:var(--rl-rust-text,#F09978)}
.s-gold{stroke:var(--rl-gold,#E9C97A)} .s-aqua{stroke:var(--rl-aqua,#3FE0C5)} .s-rust{stroke:var(--rl-rust,#E0683F)}
.s-mut{stroke:var(--rl-muted,#AEB4BF)}
.lvl{stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--rl-panel,#12151E);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:5 4}
.dot{stroke-dasharray:2 3}
.path{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cu{fill:var(--rl-candle-up,#8E958F);stroke:var(--rl-candle-up,#8E958F)}
.cd{fill:var(--rl-ground,#08090D);stroke:var(--rl-candle-dn,#8E958F)}
.wk{stroke:var(--rl-candle-up,#8E958F);stroke-width:1}
.hl-aqua .cu,.hl-aqua .cd{stroke:var(--rl-aqua,#3FE0C5)} .hl-aqua .wk{stroke:var(--rl-aqua,#3FE0C5);stroke-width:1.5}
.hl-rust .cu,.hl-rust .cd{stroke:var(--rl-rust,#E0683F)} .hl-rust .wk{stroke:var(--rl-rust,#E0683F);stroke-width:1.5}
.chip-gold{fill:rgba(233,201,122,.12);stroke:var(--rl-gold,#E9C97A)}
.chip-aqua{fill:rgba(63,224,197,.10);stroke:var(--rl-aqua,#3FE0C5)}
.chip-rust{fill:rgba(224,104,63,.12);stroke:var(--rl-rust,#E0683F)}
.chip-mut{fill:rgba(174,180,191,.06);stroke:var(--rl-muted,#AEB4BF);stroke-dasharray:4 3}
.fillzone{fill:rgba(233,201,122,.07)}
.overlap{fill:url(#rl-hatch)}
</style><defs><pattern id="rl-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(201,162,75,.10)" /><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(201,162,75,.45)" stroke-width="1.5" /></pattern></defs><rect x="0" y="0" width="360" height="600" rx="0" class="bg" /><text x="14" y="22" class="t k m gold">RL-MND-06</text><text x="346" y="22" class="t k mut" text-anchor="end">SYNTHETIC SCHEMATIC</text><text x="14" y="40" class="t h">Written before. Scored after — with no P&amp;L.</text><text x="14" y="58" class="t mut">Illustrative entry, 09:38 London — not a recommendation.</text><g class="st" data-s="1"><text x="14" y="80" class="t k gold">1 · PLAN</text><rect x="10" y="88" width="340" height="52" rx="6" class="chip-gold" /><text x="20" y="105" class="t k gold">THESIS</text><text x="20" y="122" class="t"><tspan x="20" dy="0">H1 lower highs. M15 reached above EQH1,</tspan><tspan x="20" dy="13.5">closed back below.</tspan></text></g><g class="st" data-s="2"><rect x="10" y="148" width="166" height="60" rx="6" class="chip-rust" /><text x="18" y="165" class="t k rust">INVALIDATION</text><text x="18" y="182" class="t"><tspan x="18" dy="0">M15 close back above</tspan><tspan x="18" dy="13.5">EQH1. A defined event.</tspan></text><rect x="184" y="148" width="166" height="60" rx="6" class="chip-rust" /><text x="192" y="165" class="t k rust">RISK</text><text x="192" y="182" class="t"><tspan x="192" dy="0">0.5% (illustrative only).</tspan><tspan x="192" dy="13.5">Lot from your MT5 spec.</tspan></text><rect x="10" y="216" width="340" height="36" rx="6" class="chip-gold" /><text x="18" y="238" class="t k gold">STOP ME IF</text><text x="100" y="238" class="t">no follow-through within 2 candles.</text><text x="14" y="266" class="t mut it">+ why now, session &amp; calendar — six fields in the lesson.</text></g><g class="st" data-s="3"><text x="14" y="286" class="t k gold">2 · DECIDE</text><line x1="180" y1="274" x2="180" y2="288" class="lvl s-mut" /><path d="M180 288 L 272 314 L 180 340 L 88 314 Z" class="lvl s-gold" /><text x="180" y="311" class="t" text-anchor="middle">Is invalidation a</text><text x="180" y="325" class="t" text-anchor="middle">number or event?</text><line x1="88" y1="314" x2="50" y2="314" class="lvl s-mut" /><line x1="50" y1="314" x2="50" y2="356" class="lvl s-mut" /><text x="56" y="309" class="t k mut" text-anchor="end">no</text><line x1="272" y1="314" x2="310" y2="314" class="lvl s-mut" /><line x1="310" y1="314" x2="310" y2="356" class="lvl s-mut" /><text x="304" y="309" class="t k aqua">yes</text></g><g class="st" data-s="3"><rect x="10" y="356" width="166" height="88" rx="6" class="chip-mut" /><text x="18" y="373" class="t k mut">SKIPPED / EXPIRED</text><text x="18" y="390" class="t"><tspan x="18" dy="0">No invalidation → not ready.</tspan><tspan x="18" dy="13.5">Or the stop-me condition</tspan><tspan x="18" dy="13.5">hit first. No order.</tspan><tspan x="18" dy="13.5">Still logged.</tspan></text><rect x="184" y="356" width="166" height="88" rx="6" class="chip-aqua" /><text x="192" y="373" class="t k aqua">ORDER PLACED</text><text x="192" y="390" class="t"><tspan x="192" dy="0">Entry timestamped after</tspan><tspan x="192" dy="13.5">the plan. Outcome is</tspan><tspan x="192" dy="13.5">recorded — win, loss or</tspan><tspan x="192" dy="13.5">manual exit.</tspan></text></g><g class="st" data-s="4"><line x1="93" y1="444" x2="93" y2="470" class="lvl s-mut" /><line x1="267" y1="444" x2="267" y2="470" class="lvl s-mut" /><text x="14" y="466" class="t k gold">3 · REVIEW</text><rect x="10" y="474" width="340" height="118" rx="6" class="chip-aqua" /><text x="20" y="492" class="t k aqua">SCORE EXECUTION, NOT PROFIT</text><text x="20" y="512" class="t">Did I wait for what the thesis said?</text><text x="340" y="512" class="t m" text-anchor="end">Y / N</text><text x="20" y="530" class="t">Did I honour the invalidation?</text><text x="340" y="530" class="t m" text-anchor="end">Y / N</text><text x="20" y="548" class="t">Was risk what I wrote?</text><text x="340" y="548" class="t m" text-anchor="end">Y / N</text><text x="20" y="572" class="t mut it">Skipped entries count too — they keep the sample honest.</text></g></svg>