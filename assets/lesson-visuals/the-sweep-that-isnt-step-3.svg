<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="the-sweep-that-isnt-t the-sweep-that-isnt-d" class="rlv-svg" data-steps="4"><title id="the-sweep-that-isnt-t">The Sweep That Isn't — three distinct states, synthetic schematic</title><desc id="the-sweep-that-isnt-d">Three panels, each with the level EQH1 and a three-part scorecard. State 1, wick-only probe: the wick reaches above EQH1 and the candle closes back below; wick pass, close pass, follow-through not yet — a shape, not a signal, unconfirmed until part 3. State 2, close beyond the level: the candle closes above EQH1 and the next holds; wick pass, close fail, follow-through not applicable — a breakout, a different event, drop the sweep label. State 3, failed continuation: wick above, close back below, then several overlapping candles of chop; wick pass, close pass, follow-through fail — setup expired, not a loss, not a missed trade, log it. Footer: part 3 is often skipped; count your own cases.</desc><style>
.bg{fill:var(--rl-ground,#08090D)}
.panel{fill:var(--rl-panel,#12151E);stroke:var(--rl-line,#303744);stroke-width:1}
.grid{stroke:var(--rl-line,#303744);stroke-width:1}
.t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;fill:var(--rl-text,#F3F2EC)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.h{font-size:12.5px;font-weight:650}
.k{font-size:10.5px;letter-spacing:.045em;text-transform:uppercase;font-weight:600}
.mut{fill:var(--rl-muted,#AEB4BF)}
.it{font-style:italic}
.b{font-weight:650}
.gold{fill:var(--rl-gold,#E9C97A)} .aqua{fill:var(--rl-aqua,#3FE0C5)} .rust{fill:var(--rl-rust-text,#F09978)}
.s-gold{stroke:var(--rl-gold,#E9C97A)} .s-aqua{stroke:var(--rl-aqua,#3FE0C5)} .s-rust{stroke:var(--rl-rust,#E0683F)}
.s-mut{stroke:var(--rl-muted,#AEB4BF)}
.lvl{stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--rl-panel,#12151E);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:5 4}
.dot{stroke-dasharray:2 3}
.path{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cu{fill:var(--rl-candle-up,#8E958F);stroke:var(--rl-candle-up,#8E958F)}
.cd{fill:var(--rl-ground,#08090D);stroke:var(--rl-candle-dn,#8E958F)}
.wk{stroke:var(--rl-candle-up,#8E958F);stroke-width:1}
.hl-aqua .cu,.hl-aqua .cd{stroke:var(--rl-aqua,#3FE0C5)} .hl-aqua .wk{stroke:var(--rl-aqua,#3FE0C5);stroke-width:1.5}
.hl-rust .cu,.hl-rust .cd{stroke:var(--rl-rust,#E0683F)} .hl-rust .wk{stroke:var(--rl-rust,#E0683F);stroke-width:1.5}
.chip-gold{fill:rgba(233,201,122,.12);stroke:var(--rl-gold,#E9C97A)}
.chip-aqua{fill:rgba(63,224,197,.10);stroke:var(--rl-aqua,#3FE0C5)}
.chip-rust{fill:rgba(224,104,63,.12);stroke:var(--rl-rust,#E0683F)}
.chip-mut{fill:rgba(174,180,191,.06);stroke:var(--rl-muted,#AEB4BF);stroke-dasharray:4 3}
.fillzone{fill:rgba(233,201,122,.07)}
.overlap{fill:url(#rl-hatch)}
</style><defs><pattern id="rl-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(201,162,75,.10)" /><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(201,162,75,.45)" stroke-width="1.5" /></pattern></defs><rect x="0" y="0" width="360" height="590" rx="0" class="bg" /><text x="14" y="22" class="t k m gold">RL-LIQ-03</text><text x="346" y="22" class="t k mut" text-anchor="end">SYNTHETIC SCHEMATIC</text><text x="14" y="40" class="t h">Three states that look alike — and aren't.</text><text x="14" y="58" class="t mut"><tspan x="14" dy="0">Score wick, close and follow-through separately,</tspan><tspan x="14" dy="13.5">before the next candles arrive.</tspan></text><g class="st" data-s="1"><rect x="10" y="84" width="340" height="152" rx="6" class="panel" /><text x="20" y="102" class="t k gold">STATE 1 · WICK-ONLY PROBE</text><line x1="18" y1="152.3" x2="150" y2="152.3" class="lvl s-gold" /><text x="20" y="147.3" class="t m gold">EQH1</text><line x1="26" y1="190.5" x2="26" y2="214.4" class="wk" /><rect x="22.0" y="195.3" width="8" height="14.399999999999977" class="cu" stroke-width="1" /><line x1="40" y1="176.2" x2="40" y2="200.1" class="wk" /><rect x="36.0" y="181.0" width="8" height="14.300000000000011" class="cu" stroke-width="1" /><line x1="54" y1="166.6" x2="54" y2="185.7" class="wk" /><rect x="50.0" y="171.4" width="8" height="9.599999999999994" class="cu" stroke-width="1" /><g class="hl-aqua"><line x1="68" y1="133.1" x2="68" y2="176.2" class="wk" /><rect x="64.0" y="166.6" width="8" height="4.800000000000011" class="cu" stroke-width="1" /></g><text x="164" y="131" class="t">1. Wick beyond</text><rect x="284" y="120" width="58" height="16" rx="3" class="chip-aqua" /><text x="313" y="131.5" class="t k aqua" text-anchor="middle">PASS</text><text x="164" y="153" class="t">2. Close back below</text><rect x="284" y="142" width="58" height="16" rx="3" class="chip-aqua" /><text x="313" y="153.5" class="t k aqua" text-anchor="middle">PASS</text><text x="164" y="175" class="t">3. Follow-through</text><rect x="284" y="164" width="58" height="16" rx="3" class="chip-mut" /><text x="313" y="175.5" class="t k mut" text-anchor="middle">NOT YET</text><text x="164" y="198" class="t b"><tspan x="164" dy="0">A shape, not a signal.</tspan><tspan x="164" dy="13.5">Unconfirmed until part 3.</tspan></text></g><g class="st" data-s="2"><rect x="10" y="244" width="340" height="152" rx="6" class="panel" /><text x="20" y="262" class="t k gold">STATE 2 · CLOSE BEYOND THE LEVEL</text><line x1="18" y1="312.3" x2="150" y2="312.3" class="lvl s-gold" /><text x="20" y="307.3" class="t m gold">EQH1</text><line x1="26" y1="350.5" x2="26" y2="374.4" class="wk" /><rect x="22.0" y="355.3" width="8" height="14.399999999999977" class="cu" stroke-width="1" /><line x1="40" y1="336.2" x2="40" y2="360.1" class="wk" /><rect x="36.0" y="341.0" width="8" height="14.300000000000011" class="cu" stroke-width="1" /><line x1="54" y1="326.6" x2="54" y2="345.7" class="wk" /><rect x="50.0" y="331.4" width="8" height="9.600000000000023" class="cu" stroke-width="1" /><g class="hl-rust"><line x1="68" y1="288.3" x2="68" y2="333.8" class="wk" /><rect x="64.0" y="297.9" width="8" height="33.5" class="cu" stroke-width="1" /></g><line x1="82" y1="288.3" x2="82" y2="307.5" class="wk" /><rect x="78.0" y="295.5" width="8" height="2.3999999999999773" class="cu" stroke-width="1" /><text x="164" y="291" class="t">1. Wick beyond</text><rect x="284" y="280" width="58" height="16" rx="3" class="chip-aqua" /><text x="313" y="291.5" class="t k aqua" text-anchor="middle">PASS</text><text x="164" y="313" class="t">2. Close back below</text><rect x="284" y="302" width="58" height="16" rx="3" class="chip-rust" /><text x="313" y="313.5" class="t k rust" text-anchor="middle">FAIL</text><text x="164" y="335" class="t">3. Follow-through</text><rect x="284" y="324" width="58" height="16" rx="3" class="chip-mut" /><text x="313" y="335.5" class="t k mut" text-anchor="middle">N/A</text><text x="164" y="358" class="t b"><tspan x="164" dy="0">A breakout — different event.</tspan><tspan x="164" dy="13.5">Drop the sweep label.</tspan></text></g><g class="st" data-s="3"><rect x="10" y="404" width="340" height="152" rx="6" class="panel" /><text x="20" y="422" class="t k gold">STATE 3 · FAILED CONTINUATION</text><line x1="18" y1="472.3" x2="150" y2="472.3" class="lvl s-gold" /><text x="20" y="467.3" class="t m gold">EQH1</text><line x1="26" y1="510.5" x2="26" y2="534.4" class="wk" /><rect x="22.0" y="515.3" width="8" height="14.400000000000091" class="cu" stroke-width="1" /><line x1="40" y1="496.2" x2="40" y2="520.1" class="wk" /><rect x="36.0" y="501.0" width="8" height="14.299999999999955" class="cu" stroke-width="1" /><line x1="54" y1="486.6" x2="54" y2="505.7" class="wk" /><rect x="50.0" y="491.4" width="8" height="9.600000000000023" class="cu" stroke-width="1" /><g class="hl-aqua"><line x1="68" y1="453.1" x2="68" y2="496.2" class="wk" /><rect x="64.0" y="486.6" width="8" height="4.7999999999999545" class="cu" stroke-width="1" /></g><line x1="82" y1="479.4" x2="82" y2="493.8" class="wk" /><rect x="78.0" y="486.6" width="8" height="4.7999999999999545" class="cd" stroke-width="1" /><line x1="96" y1="481.8" x2="96" y2="496.2" class="wk" /><rect x="92.0" y="484.2" width="8" height="7.199999999999989" class="cu" stroke-width="1" /><line x1="110" y1="479.4" x2="110" y2="493.8" class="wk" /><rect x="106.0" y="484.2" width="8" height="4.800000000000011" class="cd" stroke-width="1" /><line x1="124" y1="481.8" x2="124" y2="493.8" class="wk" /><rect x="120.0" y="486.6" width="8" height="2.3999999999999773" class="cu" stroke-width="1" /><rect x="76" y="477.0" width="54" height="21.600000000000023" rx="2" class="chip-mut" /><text x="103.0" y="510.6" class="t mut it" text-anchor="middle">chop</text><text x="164" y="451" class="t">1. Wick beyond</text><rect x="284" y="440" width="58" height="16" rx="3" class="chip-aqua" /><text x="313" y="451.5" class="t k aqua" text-anchor="middle">PASS</text><text x="164" y="473" class="t">2. Close back below</text><rect x="284" y="462" width="58" height="16" rx="3" class="chip-aqua" /><text x="313" y="473.5" class="t k aqua" text-anchor="middle">PASS</text><text x="164" y="495" class="t">3. Follow-through</text><rect x="284" y="484" width="58" height="16" rx="3" class="chip-rust" /><text x="313" y="495.5" class="t k rust" text-anchor="middle">FAIL</text><text x="164" y="518" class="t b"><tspan x="164" dy="0">Setup expired. Not a loss,</tspan><tspan x="164" dy="13.5">not a missed trade — log it.</tspan></text></g><g class="st" data-s="4" display="none"><text x="180.0" y="578" class="t it gold" text-anchor="middle">Part 3 is often skipped. Count your own cases.</text></g></svg>