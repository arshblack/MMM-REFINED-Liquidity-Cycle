<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 644" role="img" aria-labelledby="when-london-matters-t when-london-matters-d" class="rlv-svg" data-steps="4"><title id="when-london-matters-t">When the London Window Matters — session clock with daylight-saving assumptions, schematic</title><desc id="when-london-matters-d">Two session timelines on a London-local axis from 04:00 to 22:00 with UTC underneath. Top, most of the year, gap 5 hours, shown with UK on BST (UTC+1) and US on EDT: Asia to 09:00 (thin), London 08–16, New York 13–21, overlap 3 hours 13–16; the 08:30 New York US data release lands at 13:30 London. Two identical setups: at 09:40 London, London active with no data due, context supports the read; at 13:25, five minutes before US CPI, context weakens it because the release dominates. Bottom, misalignment weeks, gap 4 hours — in 2026, 8–29 March and 25 October–1 November, UK on GMT and US on EDT: London 08–16 equals UTC, New York 12–20, overlap 4 hours 12–16, and the US release lands at 12:30 London. Footer: the third clock is your broker server time — derive its offset in MT5; session windows are conventions; review these dates yearly.</desc><style>
.bg{fill:var(--rl-ground,#08090D)}
.panel{fill:var(--rl-panel,#12151E);stroke:var(--rl-line,#303744);stroke-width:1}
.grid{stroke:var(--rl-line,#303744);stroke-width:1}
.t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;fill:var(--rl-text,#F3F2EC)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.h{font-size:12.5px;font-weight:650}
.k{font-size:10.5px;letter-spacing:.045em;text-transform:uppercase;font-weight:600}
.mut{fill:var(--rl-muted,#AEB4BF)}
.it{font-style:italic}
.b{font-weight:650}
.gold{fill:var(--rl-gold,#E9C97A)} .aqua{fill:var(--rl-aqua,#3FE0C5)} .rust{fill:var(--rl-rust-text,#F09978)}
.s-gold{stroke:var(--rl-gold,#E9C97A)} .s-aqua{stroke:var(--rl-aqua,#3FE0C5)} .s-rust{stroke:var(--rl-rust,#E0683F)}
.s-mut{stroke:var(--rl-muted,#AEB4BF)}
.lvl{stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--rl-panel,#12151E);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:5 4}
.dot{stroke-dasharray:2 3}
.path{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cu{fill:var(--rl-candle-up,#8E958F);stroke:var(--rl-candle-up,#8E958F)}
.cd{fill:var(--rl-ground,#08090D);stroke:var(--rl-candle-dn,#8E958F)}
.wk{stroke:var(--rl-candle-up,#8E958F);stroke-width:1}
.hl-aqua .cu,.hl-aqua .cd{stroke:var(--rl-aqua,#3FE0C5)} .hl-aqua .wk{stroke:var(--rl-aqua,#3FE0C5);stroke-width:1.5}
.hl-rust .cu,.hl-rust .cd{stroke:var(--rl-rust,#E0683F)} .hl-rust .wk{stroke:var(--rl-rust,#E0683F);stroke-width:1.5}
.chip-gold{fill:rgba(233,201,122,.12);stroke:var(--rl-gold,#E9C97A)}
.chip-aqua{fill:rgba(63,224,197,.10);stroke:var(--rl-aqua,#3FE0C5)}
.chip-rust{fill:rgba(224,104,63,.12);stroke:var(--rl-rust,#E0683F)}
.chip-mut{fill:rgba(174,180,191,.06);stroke:var(--rl-muted,#AEB4BF);stroke-dasharray:4 3}
.fillzone{fill:rgba(233,201,122,.07)}
.overlap{fill:url(#rl-hatch)}
</style><defs><pattern id="rl-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(201,162,75,.10)" /><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(201,162,75,.45)" stroke-width="1.5" /></pattern></defs><rect x="0" y="0" width="360" height="644" rx="0" class="bg" /><text x="14" y="22" class="t k m gold">RL-KZN-02</text><text x="346" y="22" class="t k mut" text-anchor="end">SYNTHETIC SCHEMATIC</text><text x="14" y="40" class="t h">Same shape, different hour, different context.</text><g class="st" data-s="1"><rect x="10" y="52" width="340" height="214" rx="6" class="panel" /><text x="20" y="70" class="t k gold">MOST OF THE YEAR · GAP 5H</text><text x="20" y="85" class="t mut">summer example: UK on BST (UTC+1), US on EDT</text><text x="24" y="102" class="t k mut">LONDON</text><line x1="26.0" y1="110" x2="26.0" y2="202" class="grid" /><line x1="61.3" y1="110" x2="61.3" y2="202" class="grid" /><line x1="96.7" y1="110" x2="96.7" y2="202" class="grid" /><line x1="132.0" y1="110" x2="132.0" y2="202" class="grid" /><line x1="167.3" y1="110" x2="167.3" y2="202" class="grid" /><line x1="202.7" y1="110" x2="202.7" y2="202" class="grid" /><line x1="238.0" y1="110" x2="238.0" y2="202" class="grid" /><line x1="273.3" y1="110" x2="273.3" y2="202" class="grid" /><line x1="308.7" y1="110" x2="308.7" y2="202" class="grid" /><line x1="344.0" y1="110" x2="344.0" y2="202" class="grid" /><text x="96.7" y="102" class="t m mut" text-anchor="middle">08</text><text x="167.3" y="102" class="t m mut" text-anchor="middle">12</text><text x="238.0" y="102" class="t m mut" text-anchor="middle">16</text><text x="308.7" y="102" class="t m mut" text-anchor="middle">20</text><line x1="193.8" y1="108" x2="193.8" y2="204" class="lvl s-rust dash" /><rect x="26.0" y="116" width="88.3" height="18" rx="3" class="chip-mut" /><text x="31.0" y="128.5" class="t mut">Asia (thin)</text><rect x="96.7" y="140" width="141.3" height="18" rx="3" class="chip-gold" /><text x="233.0" y="152.5" class="t halo" text-anchor="end">London 08–16</text><rect x="185.0" y="164" width="141.3" height="18" rx="3" class="chip-gold" /><text x="321.3" y="176.5" class="t halo" text-anchor="end">New York 13–21</text><rect x="185.0" y="188" width="53.0" height="14" class="overlap" /><text x="242.0" y="199" class="t gold">overlap 3h</text><text x="24" y="218" class="t k mut">UTC</text><text x="96.7" y="218" class="t m mut" text-anchor="middle">07</text><text x="167.3" y="218" class="t m mut" text-anchor="middle">11</text><text x="238.0" y="218" class="t m mut" text-anchor="middle">15</text><text x="308.7" y="218" class="t m mut" text-anchor="middle">19</text><text x="20" y="238" class="t rust">Rust line: US data 08:30 New York = 13:30 London</text><text x="20" y="254" class="t mut">London = UTC+1 in summer (BST), = UTC in winter.</text></g><g class="st" data-s="2"><line x1="126.1" y1="108" x2="126.1" y2="204" class="lvl s-aqua" /><circle cx="126.1" cy="156" r="4" class="aqua" /><circle cx="192.4" cy="156" r="4" class="rust" /><text x="131.1" y="127" class="t m aqua halo">09:40</text><text x="197.4" y="127" class="t m rust halo">13:25</text></g><g class="st" data-s="2"><rect x="10" y="272" width="166" height="72" rx="6" class="chip-aqua" /><text x="18" y="289" class="t k aqua">SETUP AT 09:40</text><text x="18" y="306" class="t"><tspan x="18" dy="0">London active, no data due.</tspan><tspan x="18" dy="13.5">Context: supports the read.</tspan></text><rect x="184" y="272" width="166" height="72" rx="6" class="chip-rust" /><text x="192" y="289" class="t k rust">SAME SETUP, 13:25</text><text x="192" y="306" class="t"><tspan x="192" dy="0">5 min before US CPI.</tspan><tspan x="192" dy="13.5">Context: weakens it —</tspan><tspan x="192" dy="13.5">the release dominates.</tspan></text></g><g class="st" data-s="3"><rect x="10" y="352" width="340" height="214" rx="6" class="panel" /><text x="20" y="370" class="t k gold">MISALIGNMENT WEEKS · GAP 4H</text><text x="20" y="385" class="t mut">2026: 8–29 Mar, 25 Oct–1 Nov (UK GMT, US EDT)</text><text x="24" y="402" class="t k mut">LONDON</text><line x1="26.0" y1="410" x2="26.0" y2="502" class="grid" /><line x1="61.3" y1="410" x2="61.3" y2="502" class="grid" /><line x1="96.7" y1="410" x2="96.7" y2="502" class="grid" /><line x1="132.0" y1="410" x2="132.0" y2="502" class="grid" /><line x1="167.3" y1="410" x2="167.3" y2="502" class="grid" /><line x1="202.7" y1="410" x2="202.7" y2="502" class="grid" /><line x1="238.0" y1="410" x2="238.0" y2="502" class="grid" /><line x1="273.3" y1="410" x2="273.3" y2="502" class="grid" /><line x1="308.7" y1="410" x2="308.7" y2="502" class="grid" /><line x1="344.0" y1="410" x2="344.0" y2="502" class="grid" /><text x="96.7" y="402" class="t m mut" text-anchor="middle">08</text><text x="167.3" y="402" class="t m mut" text-anchor="middle">12</text><text x="238.0" y="402" class="t m mut" text-anchor="middle">16</text><text x="308.7" y="402" class="t m mut" text-anchor="middle">20</text><line x1="176.2" y1="408" x2="176.2" y2="504" class="lvl s-rust dash" /><rect x="26.0" y="416" width="88.3" height="18" rx="3" class="chip-mut" /><text x="31.0" y="428.5" class="t mut">Asia (thin)</text><rect x="96.7" y="440" width="141.3" height="18" rx="3" class="chip-gold" /><text x="233.0" y="452.5" class="t halo" text-anchor="end">London 08–16</text><rect x="167.3" y="464" width="141.39999999999998" height="18" rx="3" class="chip-gold" /><text x="303.7" y="476.5" class="t halo" text-anchor="end">New York 12–20</text><rect x="167.3" y="488" width="70.69999999999999" height="14" class="overlap" /><text x="242.0" y="499" class="t gold">overlap 4h</text><text x="24" y="518" class="t k mut">UTC</text><text x="96.7" y="518" class="t m mut" text-anchor="middle">08</text><text x="167.3" y="518" class="t m mut" text-anchor="middle">12</text><text x="238.0" y="518" class="t m mut" text-anchor="middle">16</text><text x="308.7" y="518" class="t m mut" text-anchor="middle">20</text><text x="20" y="538" class="t rust">Rust line: US data 08:30 New York = 12:30 London</text><text x="20" y="554" class="t mut">London local = UTC. The US release moves an hour earlier.</text></g><g class="st" data-s="4"><rect x="10" y="574" width="340" height="62" rx="6" class="chip-mut" /><text x="18" y="591" class="t mut"><tspan x="18" dy="0">Third clock: your broker's server time. Derive the</tspan><tspan x="18" dy="13.5">offset in MT5 — don't copy one. Windows are conventions,</tspan><tspan x="18" dy="13.5">not exchange hours. Review these dates every year.</tspan></text></g></svg>