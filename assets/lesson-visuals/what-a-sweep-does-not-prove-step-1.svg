<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" role="img" aria-labelledby="what-a-sweep-does-not-prove-t what-a-sweep-does-not-prove-d" class="rlv-svg" data-steps="4"><title id="what-a-sweep-does-not-prove-t">What a Sweep Does Not Prove — synthetic schematic</title><desc id="what-a-sweep-does-not-prove-d">A gold level EQH1 made of two prior highs. A candle trades above EQH1 and closes back below it; both facts are labelled observed. After a 'now' line two dashed paths are drawn equally: possible A, price moves down and away; possible B, price closes back above EQH1 and the read is invalid. Neither is on the chart yet. A ledger separates what is on the chart (price traded above EQH1, candle closed below, OHLC plus tick volume) from what is inferred and not in it (who traded, why, that it was the real move, which future comes next). Risk note: a story about intent feels like certainty, which sizes up and holds past invalidation; the observed read keeps an invalidation — a close back above EQH1.</desc><style>
.bg{fill:var(--rl-ground,#08090D)}
.panel{fill:var(--rl-panel,#12151E);stroke:var(--rl-line,#303744);stroke-width:1}
.grid{stroke:var(--rl-line,#303744);stroke-width:1}
.t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;fill:var(--rl-text,#F3F2EC)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.h{font-size:12.5px;font-weight:650}
.k{font-size:10.5px;letter-spacing:.045em;text-transform:uppercase;font-weight:600}
.mut{fill:var(--rl-muted,#AEB4BF)}
.it{font-style:italic}
.b{font-weight:650}
.gold{fill:var(--rl-gold,#E9C97A)} .aqua{fill:var(--rl-aqua,#3FE0C5)} .rust{fill:var(--rl-rust-text,#F09978)}
.s-gold{stroke:var(--rl-gold,#E9C97A)} .s-aqua{stroke:var(--rl-aqua,#3FE0C5)} .s-rust{stroke:var(--rl-rust,#E0683F)}
.s-mut{stroke:var(--rl-muted,#AEB4BF)}
.lvl{stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--rl-panel,#12151E);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:5 4}
.dot{stroke-dasharray:2 3}
.path{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cu{fill:var(--rl-candle-up,#8E958F);stroke:var(--rl-candle-up,#8E958F)}
.cd{fill:var(--rl-ground,#08090D);stroke:var(--rl-candle-dn,#8E958F)}
.wk{stroke:var(--rl-candle-up,#8E958F);stroke-width:1}
.hl-aqua .cu,.hl-aqua .cd{stroke:var(--rl-aqua,#3FE0C5)} .hl-aqua .wk{stroke:var(--rl-aqua,#3FE0C5);stroke-width:1.5}
.hl-rust .cu,.hl-rust .cd{stroke:var(--rl-rust,#E0683F)} .hl-rust .wk{stroke:var(--rl-rust,#E0683F);stroke-width:1.5}
.chip-gold{fill:rgba(233,201,122,.12);stroke:var(--rl-gold,#E9C97A)}
.chip-aqua{fill:rgba(63,224,197,.10);stroke:var(--rl-aqua,#3FE0C5)}
.chip-rust{fill:rgba(224,104,63,.12);stroke:var(--rl-rust,#E0683F)}
.chip-mut{fill:rgba(174,180,191,.06);stroke:var(--rl-muted,#AEB4BF);stroke-dasharray:4 3}
.fillzone{fill:rgba(233,201,122,.07)}
.overlap{fill:url(#rl-hatch)}
</style><defs><pattern id="rl-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(201,162,75,.10)" /><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(201,162,75,.45)" stroke-width="1.5" /></pattern></defs><rect x="0" y="0" width="360" height="534" rx="0" class="bg" /><text x="14" y="22" class="t k m gold">RL-LIQ-04</text><text x="346" y="22" class="t k mut" text-anchor="end">SYNTHETIC SCHEMATIC</text><text x="14" y="40" class="t h">One wick. Two futures. Same four numbers.</text><rect x="10" y="54" width="340" height="250" rx="6" class="panel" /><g class="st" data-s="1"><line x1="26.0" y1="188.5" x2="26.0" y2="210.7" class="wk" /><rect x="22.0" y="192.2" width="8" height="14.800000000000011" class="cu" stroke-width="1" /><line x1="39.5" y1="166.3" x2="39.5" y2="195.9" class="wk" /><rect x="35.5" y="170.0" width="8" height="22.19999999999999" class="cu" stroke-width="1" /><line x1="53.0" y1="151.5" x2="53.0" y2="173.7" class="wk" /><rect x="49.0" y="158.9" width="8" height="11.099999999999994" class="cu" stroke-width="1" /><line x1="66.5" y1="155.2" x2="66.5" y2="184.8" class="wk" /><rect x="62.5" y="158.9" width="8" height="22.19999999999999" class="cd" stroke-width="1" /><line x1="80.0" y1="173.7" x2="80.0" y2="192.2" class="wk" /><rect x="76.0" y="177.4" width="8" height="3.6999999999999886" class="cu" stroke-width="1" /><line x1="93.5" y1="151.9" x2="93.5" y2="179.2" class="wk" /><rect x="89.5" y="160.8" width="8" height="16.599999999999994" class="cu" stroke-width="1" /><line x1="107.0" y1="158.9" x2="107.0" y2="179.2" class="wk" /><rect x="103.0" y="160.8" width="8" height="14.799999999999983" class="cd" stroke-width="1" /><line x1="120.5" y1="164.4" x2="120.5" y2="181.1" class="wk" /><rect x="116.5" y="166.3" width="8" height="9.299999999999983" class="cu" stroke-width="1" /><line x1="20" y1="151.5" x2="240" y2="151.5" class="lvl s-gold" /><text x="20" y="146.5" class="t m gold b">EQH1</text><text x="53.0" y="133.5" class="t m gold" text-anchor="middle">1</text><text x="93.5" y="133.5" class="t m gold" text-anchor="middle">2</text></g><g class="st" data-s="2" display="none"><g class="hl-aqua"><line x1="134.0" y1="133.0" x2="134.0" y2="168.2" class="wk" /><rect x="130.0" y="162.6" width="8" height="3.700000000000017" class="cu" stroke-width="1" /></g><text x="20" y="76" class="t k aqua">OBSERVED · traded above EQH1</text><line x1="134.0" y1="80" x2="134.0" y2="130.0" class="lvl s-aqua" /><text x="20" y="270" class="t k aqua">OBSERVED · closed back below</text><line x1="134.0" y1="165.6" x2="134.0" y2="260" class="lvl s-aqua" /></g><g class="st" data-s="3" display="none"><line x1="148.0" y1="88" x2="148.0" y2="256" class="lvl s-mut dot" /><text x="153.0" y="102" class="t k mut halo">NOW</text><path d="M148.0 162.6 C 178.0 172.6, 198.0 199.6, 234.0 214.4" class="path s-mut dash" /><path d="M148.0 162.6 C 178.0 154.6, 194.0 136.7, 234.0 125.6" class="path s-mut dash" /><line x1="188.0" y1="151.5" x2="338" y2="151.5" class="lvl s-gold dot" /><text x="240.0" y="105.2" class="t rust"><tspan x="240.0" dy="0">Possible B:</tspan><tspan x="240.0" dy="13.5">closes back</tspan><tspan x="240.0" dy="13.5">above EQH1 →</tspan><tspan x="240.0" dy="13.5">read invalid</tspan></text><text x="240.0" y="207.0" class="t mut"><tspan x="240.0" dy="0">Possible A:</tspan><tspan x="240.0" dy="13.5">moves down</tspan><tspan x="240.0" dy="13.5">and away</tspan></text><text x="342" y="292" class="t mut it" text-anchor="end">Neither is on the chart yet.</text></g><g class="st" data-s="4" display="none"><rect x="10" y="314" width="166" height="108" rx="6" class="chip-aqua" /><text x="20" y="332" class="t k aqua">ON THE CHART</text><text x="20" y="352" class="t"><tspan x="20" dy="0">• Price traded above EQH1</tspan><tspan x="20" dy="13.5">• The candle closed below</tspan><tspan x="20" dy="13.5">• Open, high, low, close</tspan><tspan x="20" dy="13.5">  + tick volume. That's all.</tspan></text><rect x="184" y="314" width="166" height="108" rx="6" class="chip-mut" /><text x="194" y="332" class="t k mut">INFERRED — NOT IN IT</text><text x="194" y="352" class="t mut it"><tspan x="194" dy="0">• Who traded</tspan><tspan x="194" dy="13.5">• Why they traded</tspan><tspan x="194" dy="13.5">• That it was “real”</tspan><tspan x="194" dy="13.5">• Which future comes next</tspan></text></g><g class="st" data-s="4" display="none"><rect x="10" y="432" width="340" height="92" rx="6" class="chip-rust" /><text x="20" y="450" class="t k rust">WHERE IT SHOWS UP: RISK</text><text x="20" y="470" class="t"><tspan x="20" dy="0">A story about intent feels like certainty. Certainty</tspan><tspan x="20" dy="13.5">sizes up, and holds past the invalidation level.</tspan><tspan x="20" dy="13.5">The observed read keeps its exit condition:</tspan><tspan x="20" dy="13.5">a close back above EQH1.</tspan></text></g></svg>